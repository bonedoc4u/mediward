# .github/workflows/deploy-production.yml
# Triggers: push of a tag matching v*.*.* (e.g. v1.2.3)
# Gate: requires manual approval via GitHub Environment "production"
#
# Web deployment: handled automatically by Vercel's GitHub App when main is
# pushed. By the time a tag is created, the code is already live on
# mediward.vercel.app — no VERCEL_TOKEN or extra deploy step needed.
#
# This workflow only handles: DB migrations, Android build/sign/upload, GitHub Release.

name: Deploy to Production

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  # ─── Gate: manual approval ───────────────────────────────────────────────────
  gate:
    name: Await approval
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Production release approved for ${{ github.ref_name }}"

  # ─── 1. DB migrations ────────────────────────────────────────────────────────
  migrate:
    name: DB migrations
    runs-on: ubuntu-latest
    needs: gate
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref ${{ secrets.PROD_PROJECT_REF }} --password "${{ secrets.PROD_DB_PASSWORD }}"
          supabase db push --linked --password "${{ secrets.PROD_DB_PASSWORD }}"

  # ─── 2. Build and sign Android AAB ──────────────────────────────────────────
  # Skip gracefully until KEYSTORE_BASE64 is replaced with a real keystore.
  build-android:
    name: Build & sign Android AAB
    runs-on: ubuntu-latest
    needs: migrate
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - run: pnpm install --frozen-lockfile

      - name: Capacitor sync
        env:
          VITE_SUPABASE_URL:      ${{ secrets.PROD_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          VITE_ENVIRONMENT:       production
        run: |
          pnpm build
          pnpm exec cap sync android

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/mediward.keystore

      - name: Write keystore.properties
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=mediward.keystore
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Set versionCode from tag
        run: |
          TAG=${{ github.ref_name }}
          VERSION="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          sed -i "s/versionCode 1/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION\"/"  android/app/build.gradle

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Sign AAB
        run: |
          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore android/app/mediward.keystore \
            -storepass "${{ secrets.STORE_PASSWORD }}" \
            -keypass  "${{ secrets.KEY_PASSWORD }}" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "${{ secrets.KEY_ALIAS }}"

      - name: Remove keystore
        if: always()
        run: rm -f android/app/mediward.keystore android/keystore.properties

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediward-${{ github.ref_name }}.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload to Play Store (Internal Testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_JSON }}
          packageName:    com.mediward.app
          releaseFiles:   android/app/build/outputs/bundle/release/app-release.aab
          track:          internal
          status:         completed
          releaseName:    ${{ github.ref_name }}
          changesNotSentForReview: true

  # ─── 3. Create GitHub Release ────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" | head -30)
          else
            LOG=$(git log "${PREV_TAG}".."${{ github.ref_name }}" --pretty=format:"- %s (%h)")
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$LOG"           >> $GITHUB_ENV
          echo "EOF"            >> $GITHUB_ENV

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name:     ${{ github.ref_name }}
          release_name: MediWard ${{ github.ref_name }}
          body: |
            ## Changes in ${{ github.ref_name }}

            ${{ env.CHANGELOG }}

            ---
            **Live at:** https://mediward.vercel.app
          draft: false
          prerelease: false
